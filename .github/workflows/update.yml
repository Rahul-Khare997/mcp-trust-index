name: Update MCP Trust Index

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch: {}     # manual trigger
  push:
    paths:
      - "servers.yaml"      # re-score when the list changes
      - "src/**"
      - "templates/**"

permissions:
  contents: write            # needed to commit regenerated files

concurrency:
  group: trust-index-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Smoke tests
        run: python -m unittest discover -s tests -v

      - name: Build index (live)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/main.py

      - name: Commit regenerated artifacts
        run: |
          git config user.name  "mcp-trust-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md data/data.json badges reports
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: weekly trust index refresh [skip ci]"
            git push
          fi
